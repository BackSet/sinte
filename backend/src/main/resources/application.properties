spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sinte}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.threads.virtual.enabled=true

app.security.jwt.issuer=sinte-backend
app.security.jwt.secret=${APP_JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
app.security.jwt.access-token-minutes=30
app.security.jwt.refresh-token-days=15

app.series.generation.enabled=true
app.series.generation.cron=0 0 3 * * *
app.series.generation.horizon-days=60
