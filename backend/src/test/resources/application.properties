spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.security.jwt.issuer=sinte-backend-test
app.security.jwt.secret=change-this-secret-change-this-secret-change-this-secret
app.security.jwt.access-token-minutes=30
app.security.jwt.refresh-token-days=15
